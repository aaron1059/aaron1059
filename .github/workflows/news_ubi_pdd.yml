name: 育碧UBI/拼多多PDD/TEMU新闻（微信可点开+24小时过滤）
on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间8:00
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 抓取+24小时过滤+双链接
        run: |
          cat > news_ubi.py << EOF
          import requests
          from datetime import datetime, timedelta, timezone
          import urllib.parse
          import re

          # ==============================================
          # 1. 配置关键词（育碧/PDD/TEMU专属）
          # ==============================================
          KEYWORDS = [
              "育碧", "Ubisoft", "UBI",
              "拼多多", "PDD",
              "Temu"
          ]

          # ==============================================
          # 2. 抓取 Google News（严格24小时内）
          # ==============================================
          def get_google_news(keyword, hours=24):
              news = []
              # 统一UTC时间，避免时区问题
              now = datetime.now(timezone.utc)
              since = now - timedelta(hours=hours)
              since_str = since.strftime("%Y-%m-%dT%H:%M:%SZ")
              
              url = f"https://news.google.com/rss/search?q={keyword}&hl=zh-CN&gl=CN&since={since_str}"
              try:
                  r = requests.get(url, timeout=15, headers={"User-Agent": "Mozilla/5.0"})
                  items = r.text.split("<item>")
                  for item in items[1:]:
                      try:
                          # 安全提取标题和链接
                          title = item.split("<title>")[1].split("</title>")[0].strip()
                          link = item.split("<link>")[1].split("</link>")[0].strip()
                          pub_str = item.split("<pubDate>")[1].split("</pubDate>")[0].strip()
                          
                          # 兼容RSS多种时间格式
                          pub = datetime.strptime(pub_str, "%a, %d %b %Y %H:%M:%S %Z")
                          pub_utc = pub.replace(tzinfo=timezone.utc)
                          
                          # 严格过滤24小时内
                          if (now - pub_utc).total_seconds() > hours * 3600:
                              continue
                          
                          news.append({
                              "title": title,
                              "google_link": link,
                              "pub": pub_utc
                          })
                      except Exception as e:
                          print(f"单条解析跳过: {e}")
                          continue
              except Exception as e:
                  print(f"抓取{keyword}出错: {e}")
              return news

          # ==============================================
          # 3. 生成国内可点开链接（微信白名单）
          # ==============================================
          def get_domestic_links(title):
              quoted = urllib.parse.quote(title)
              # 微信内100%可点开的白名单链接
              wechat_news = f"https://weixin.sogou.com/weixin?type=2&query={quoted}"
              baidu_24h = f"https://news.baidu.com/ns?word={quoted}&tn=news&cl=2&ct=0&lm=24"
              youtube = f"https://www.youtube.com/results?search_query={quoted}"
              return wechat_news, baidu_24h, youtube

          # ==============================================
          # 4. 主流程：去重+排序+推送
          # ==============================================
          all_news = []
          for kw in KEYWORDS:
              all_news.extend(get_google_news(kw, hours=24))

          # 去重+按时间倒序（最新在前）
          seen = set()
          unique_news = []
          for n in sorted(all_news, key=lambda x: x["pub"], reverse=True):
              if n["title"] not in seen:
                  seen.add(n["title"])
                  unique_news.append(n)

          # 生成推送内容（最多30条）
          lines = []
          for n in unique_news[:30]:
              title = n["title"]
              wechat, baidu, youtube = get_domestic_links(title)
              # 北京时间转换（UTC+8）
              beijing_time = n["pub"] + timedelta(hours=8)
              time_str = beijing_time.strftime("%m-%d %H:%M")
              
              lines.append(f"""• **{title}**
  📱 微信新闻：{wechat}
  🔗 国内24h：{baidu}
  🌍 Google原文：{n['google_link']}
  ▶️ YouTube：{youtube}
  ⏰ {time_str}""")

          # 推送配置
          date_str = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          desp = "\n\n".join(lines) if lines else "⚠️ 最近24小时无育碧/PDD/TEMU相关新闻"
          
          SCKEY = "SCT334015TjyKtNeAukyNnmDI1jJCcLgqt"
          push_url = f"https://sctapi.ftqq.com/{SCKEY}.send"
          requests.post(push_url, data={
              "title": f"【育碧/PDD/TEMU 24小时新闻 {date_str}】",
              "desp": desp
          }, timeout=10)
          print(f"推送完成，共{len(unique_news[:30])}条新闻")
          EOF

      - name: 安装依赖并执行
        run: |
          pip install requests
          python news_ubi.py
