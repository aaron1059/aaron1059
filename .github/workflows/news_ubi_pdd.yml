name: 育碧/PDD/TEMU 24小时双链接新闻
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHON_CODE: |
        import requests
        import urllib.parse
        from datetime import datetime, timedelta, timezone

        KEYWORDS = ['育碧', 'Ubisoft', 'UBI', '拼多多', 'PDD', 'Temu']
        SCKEY = 'SCT334015TjyKNeAukyNnmDI1jJCcLgqt'
        MAX_NEWS = 30
        HOURS = 24

        def get_google_news(keyword):
            news = []
            headers = {'User-Agent': 'Mozilla/5.0'}
            since_time = (datetime.now(timezone.utc) - timedelta(hours=HOURS)).strftime('%Y-%m-%dT%H:%M:%SZ')
            url = f'https://news.google.com/rss/search?q={urllib.parse.quote(keyword)}&hl=zh-CN&gl=CN&since={since_time}'
            try:
                resp = requests.get(url, headers=headers, timeout=15)
                if resp.status_code != 200:
                    return news
                items = resp.text.split('<item>')
                for item in items[1:MAX_NEWS+1]:
                    try:
                        title = item.split('<title>')[1].split('</title>')[0].strip()
                        link = item.split('<link>')[1].split('</link>')[0].strip()
                        news.append({'title': title, 'google_link': link})
                    except:
                        continue
            except:
                pass
            return news

        def get_links(title):
            q = urllib.parse.quote(title)
            return {
                'wechat': f'https://weixin.sogou.com/weixin?type=2&query={q}',
                'baidu': f'https://news.baidu.com/ns?word={q}&tn=news&lm={HOURS}',
                'youtube': f'https://www.youtube.com/results?search_query={q}'
            }

        all_news = []
        for kw in KEYWORDS:
            all_news.extend(get_google_news(kw))

        seen = set()
        unique_news = []
        for n in all_news:
            if n['title'] not in seen:
                seen.add(n['title'])
                unique_news.append(n)

        lines = []
        for n in unique_news[:MAX_NEWS]:
            links = get_links(n['title'])
            lines.append(f'''• {n['title']}
  📱 微信可看：{links['wechat']}
  🔗 国内24h：{links['baidu']}
  🌍 Google原文：{n['google_link']}
  ▶️ YouTube：{links['youtube']}''')

        date_str = datetime.now(timezone.utc).strftime('%Y-%m-%d')
        desp = '\n\n'.join(lines) if lines else '⚠️ 最近24小时无相关新闻'
        try:
            requests.post(f'https://sctapi.ftqq.com/{SCKEY}.send', data={'title': f'【育碧/PDD/TEMU 24小时新闻 {date_str}】', 'desp': desp}, timeout=10)
            print('完成')
        except Exception as e:
            print(f'推送失败：{e}')
    steps:
      - name: 执行脚本
        run: |
          echo "$PYTHON_CODE" > script.py
          python3 script.py
