name: 育碧UBI/拼多多PDD/TEMU 24小时双链接新闻
on:
  schedule:
    - cron: '0 0 * * *'  # 北京时间每天8:00（UTC 0:00）
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 抓取新闻+24小时过滤+双链接生成
        run: |
          cat > news_ubi.py << 'EOF'
          import requests
          from datetime import datetime, timedelta, timezone
          import urllib.parse
          import email.utils

          # ====================== 配置 ======================
          KEYWORDS = ["育碧", "Ubisoft", "UBI", "拼多多", "PDD", "Temu"]
          SCKEY = "SCT334015TjyKtNeAukyNnmDI1jJCcLgqt"
          MAX_NEWS = 30
          HOURS = 24

          # ====================== 工具函数 ======================
          def parse_rss_date(date_str):
              """兼容RSS多种时间格式，统一转UTC"""
              try:
                  # 方法1：email.utils 标准解析（最稳）
                  dt = email.utils.parsedate_to_datetime(date_str)
                  return dt.astimezone(timezone.utc)
              except:
                  try:
                      # 方法2：手动解析
                      return datetime.strptime(date_str, "%a, %d %b %Y %H:%M:%S %Z").replace(tzinfo=timezone.utc)
                  except:
                      return None

          def get_google_news(keyword):
              """抓取Google News，严格24小时内"""
              news = []
              now_utc = datetime.now(timezone.utc)
              since = now_utc - timedelta(hours=HOURS)
              
              url = f"https://news.google.com/rss/search?q={urllib.parse.quote(keyword)}&hl=zh-CN&gl=CN"
              headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"}
              
              try:
                  resp = requests.get(url, headers=headers, timeout=15)
                  resp.raise_for_status()
                  items = resp.text.split("<item>")
                  
                  for item in items[1:]:
                      try:
                          title = item.split("<title>")[1].split("</title>")[0].strip()
                          link = item.split("<link>")[1].split("</link>")[0].strip()
                          pub_str = item.split("<pubDate>")[1].split("</pubDate>")[0].strip()
                          
                          pub_utc = parse_rss_date(pub_str)
                          if not pub_utc or pub_utc < since:
                              continue
                          
                          news.append({
                              "title": title,
                              "google_link": link,
                              "pub_utc": pub_utc
                          })
                      except Exception as e:
                          print(f"跳过单条新闻: {str(e)[:100]}")
                          continue
              except Exception as e:
                  print(f"抓取{keyword}失败: {str(e)[:100]}")
              return news

          def get_domestic_links(title):
              """生成国内可点开+境外可用的双链接"""
              quoted = urllib.parse.quote(title)
              return {
                  "wechat": f"https://weixin.sogou.com/weixin?type=2&query={quoted}",
                  "baidu": f"https://news.baidu.com/ns?word={quoted}&tn=news&cl=2&ct=0&lm={HOURS}",
                  "youtube": f"https://www.youtube.com/results?search_query={quoted}"
              }

          # ====================== 主流程 ======================
          if __name__ == "__main__":
              # 1. 抓取所有新闻
              all_news = []
              for kw in KEYWORDS:
                  all_news.extend(get_google_news(kw))
              
              # 2. 去重+按时间倒序
              seen = set()
              unique_news = []
              for n in sorted(all_news, key=lambda x: x["pub_utc"], reverse=True):
                  if n["title"] not in seen:
                      seen.add(n["title"])
                      unique_news.append(n)

              # 3. 生成推送内容
              lines = []
              for n in unique_news[:MAX_NEWS]:
                  links = get_domestic_links(n["title"])
                  beijing_time = n["pub_utc"] + timedelta(hours=8)
                  time_str = beijing_time.strftime("%m-%d %H:%M")
                  
                  lines.append(f"""• **{n['title']}**
  📱 微信可看：{links['wechat']}
  🔗 国内24h：{links['baidu']}
  🌍 Google原文：{n['google_link']}
  ▶️ YouTube：{links['youtube']}
  ⏰ {time_str}""")

              # 4. Server酱推送
              date_str = datetime.now(timezone.utc).strftime("%Y-%m-%d")
              desp = "\n\n".join(lines) if lines else "⚠️ 最近24小时无育碧/PDD/TEMU相关新闻"
              
              push_resp = requests.post(
                  f"https://sctapi.ftqq.com/{SCKEY}.send",
                  data={"title": f"【育碧/PDD/TEMU 24小时新闻 {date_str}】", "desp": desp},
                  timeout=10
              )
              print(f"推送完成，共{len(unique_news[:MAX_NEWS])}条，推送状态：{push_resp.status_code}")
          EOF

      - name: 安装依赖并执行
        run: |
          pip install --upgrade requests
          python news_ubi.py
