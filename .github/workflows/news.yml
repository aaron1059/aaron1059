name: 并购破产重组早报
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 抓取新闻
        run: |
          cat > news.py << EOF
          import requests
          from datetime import datetime
          import urllib.parse

          keywords = ["并购", "收购", "重组", "破产", "重整", "合并", "拆分"]
          news_list = []

          for kw in keywords:
              try:
                  q = urllib.parse.quote(kw)
                  url = f"https://news.sogou.com/news?query={q}"
                  news_list.append(f"• {kw}\n{url}")
              except:
                  continue

          date_str = datetime.now().strftime("%Y-%m-%d")

          SCKEY = "SCT334015TjyKtNeAukyNnmDI1jJCcLgqt"
          requests.post(f"https://sctapi.ftqq.com/{SCKEY}.send", data={
              "title": f"【并购/破产/重组早报 {date_str}】",
              "desp": "\n\n".join(news_list)
          })
          EOF

      - name: 运行
        run: |
          pip install requests
          python news.py
