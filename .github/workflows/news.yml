name: 全球并购破产重组早报
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 抓取新闻
        run: |
          cat > news.py << EOF
          import requests
          from datetime import datetime

          keywords = [
              "并购", "合并", "破产", "重整", "重组", "拆分", "收购"
          ]

          news_list = []

          for kw in keywords:
              try:
                  url = f"https://news.google.com/rss/search?q={kw}&hl=zh-CN&gl=CN"
                  r = requests.get(url, timeout=10)
                  text = r.text
                  items = text.split("<item>")
                  for item in items[1:6]:
                      try:
                          title = item.split("<title>")[1].split("</title>")[0]
                          # 关键：自动生成国内可打开的百度链接
                          domestic_url = f"https://news.baidu.com/news?word={title}"
                          news_list.append(f"• {title}\n{domestic_url}")
                      except:
                          continue
              except:
                  continue

          news_list = list(dict.fromkeys(news_list))[:30]
          date_str = datetime.now().strftime("%Y-%m-%d")

          SCKEY = "SCT334015TjyKtNeAukyNnmDI1jJCcLgqt"
          requests.post(f"https://sctapi.ftqq.com/{SCKEY}.send", data={
              "title": f"【并购/破产/重组早报 {date_str}】",
              "desp": "\n\n".join(news_list)
          })
          EOF

      - name: 运行
        run: |
          pip install requests
          python news.py
